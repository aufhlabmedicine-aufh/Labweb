<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>亞洲大學附設豐原醫院-檢驗科</title>

<style>
html, body {
    margin: 0;
    height: 100%;
}

.layout {
    display: grid;
    grid-template-rows: 72px 1fr;
    height: 100%;
}

.main {
    display: grid;
    grid-template-columns: 220px 1fr;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
}

@media (max-width: 760px) {
    .layout { grid-template-rows: 72px auto; height:auto; min-height:100%; }
    .main { grid-template-columns: 1fr; grid-template-rows: auto minmax(70vh, 1fr); }
    .main iframe:first-child { height: 360px; }
    .main iframe:last-child { min-height: 70vh; }
}

</style>
</head>

<body>

<div class="layout">

    <!-- 上方橫幅 -->
    <iframe src="banner.html"></iframe>

    <!-- 下方區塊 -->
    <div class="main">
        <!-- 左側選單 -->
        <iframe src="contents.html"></iframe>

        <!-- 主畫面 -->
        <iframe src="main.html" name="main"></iframe>
    </div>

</div>

</body>
</html>
